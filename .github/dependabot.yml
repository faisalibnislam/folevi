version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # The editor's packages move together: one tiptap package ahead of the others breaks the editor.
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
    # @types/node follows the Node major in .nvmrc, not the newest Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The clipper and the iPhone app keep their own lockfiles, outside the workspace (docs/SECURITY_PLAN.md P0.3).
  - package-ecosystem: npm
    directory: /apps/clipper
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/ios
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
