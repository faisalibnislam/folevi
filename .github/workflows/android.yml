# Android: compiles the app and runs the JVM unit tests (engine and app) on a GitHub runner, which has the Android
# SDK. Nothing here signs, uploads or publishes. The web export isn't built: unit tests and a debug compile don't need
# the interface in the assets.
name: Android

on:
  workflow_dispatch:
  push:
    branches: ["claude/android-*", "claude/perf-android-*"]
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/cloud-folders/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null || true
      - name: Bridge tests
        working-directory: apps/android
        run: pnpm typecheck && pnpm test:bridge
      - name: Unit tests and compile
        working-directory: apps/android
        run: ./gradlew --no-daemon :engine:testDebugUnitTest :app:testDebugUnitTest :app:compileDebugKotlin
