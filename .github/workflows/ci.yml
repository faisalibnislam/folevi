name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit & integration tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files are up to date (tokens, block schema, email templates)
        run: |
          node packages/design-tokens/scripts/build.mjs --check
          node packages/editor-schema/scripts/generate.mjs --check
          node packages/design-tokens/scripts/contrast.mjs
      - name: Lint
        run: |
          pnpm exec eslint convex
          pnpm --filter @folevi/web exec eslint src
          pnpm exec eslint --config packages/email/eslint.config.js packages/email/src packages/email/test
      - name: Typecheck
        run: |
          pnpm exec tsc -p convex/tsconfig.json --noEmit
          pnpm --filter @folevi/editor-schema exec tsc --noEmit
          pnpm --filter @folevi/email typecheck
          pnpm --filter @folevi/web exec tsc --noEmit
      - name: Schema, sync reducer, email contract and cloud provider tests
        run: |
          pnpm --filter @folevi/editor-schema test
          pnpm --filter @folevi/email test
          pnpm --filter @folevi/cloud-folders test
      - name: Convex integration tests (tenant isolation, sync, sharing, deletion, admin RBAC)
        run: pnpm exec vitest run
      - name: Web unit tests (editor conversion, paste, sync engine)
        run: pnpm --filter @folevi/web test
      - name: Web production build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example-123.convex.cloud
          NEXT_PUBLIC_APP_URL: https://app.folevi.com
          NEXT_PUBLIC_MARKETING_URL: https://folevi.com
        run: pnpm --filter @folevi/web build

  e2e:
    name: End-to-end (local Convex + Next.js + Playwright) ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    # Over 400 tests no longer fit in one job's 45 minutes: eight runners, each with its own backend and an eighth,
    # one browser at a time (with two, the runner's CPU couldn't keep the local backend's queries under its
    # 1-second limit, and a timed-out query took the page down).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a local, account-free Convex backend
        run: |
          CONVEX_AGENT_MODE=anonymous npx convex dev --once --typecheck=disable
          (CONVEX_AGENT_MODE=anonymous npx convex dev --typecheck=disable > convex.log 2>&1 &)
          sleep 10
          node scripts/setup-local.mjs
          # Encryption and the Vault are off by default until launch; their specs need them on.
          for flag in e2ee vault; do
            CONVEX_AGENT_MODE=anonymous npx convex run testSupport:setFeatureFlag "{\"key\":\"$flag\",\"enabled\":true}"
          done
      - run: pnpm --filter @folevi/web exec playwright install --with-deps chromium
      - name: Build and start the web app
        # A production build, not `next dev`: compiling each page on first visit starved the runner's CPU,
        # and the local Convex backend's 1-second query limit then tripped for every open query at once.
        # `next build` reads apps/web/.env.local written by setup-local, so the build talks to the local backend.
        # NEXT_PUBLIC_FOLEVI_TEST_HOOKS lets the suite's stand-ins answer (a scripted model, an image recogniser),
        # as in development; only this build sets it (apps/web/src/lib/testHooks.ts).
        run: |
          NEXT_PUBLIC_FOLEVI_TEST_HOOKS=1 pnpm --filter @folevi/web build
          (cd apps/web && npx next start --port 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on@9.5.1 http://localhost:3000 --timeout 120000
      - name: Playwright
        # Account mode only: the local, Mac and iPhone projects need the shell build's dev server (FOLEVI_BUILD=shell,
        # E2E_LOCAL_BASE_URL), which this job doesn't start; against this build local mode reaches Convex and fails.
        run: pnpm --filter @folevi/web exec playwright test --project account --workers 1 --shard ${{ matrix.shard }}/8
        env:
          E2E_NO_SERVER: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            convex.log
            web.log

  e2e-production:
    name: End-to-end against a production build (service worker, headers)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a local, account-free Convex backend
        run: |
          CONVEX_AGENT_MODE=anonymous npx convex dev --once --typecheck=disable
          (CONVEX_AGENT_MODE=anonymous npx convex dev --typecheck=disable > convex.log 2>&1 &)
          sleep 10
          node scripts/setup-local.mjs
      - run: pnpm --filter @folevi/web exec playwright install --with-deps chromium
      - name: Build and start the production web app
        # `next build` reads apps/web/.env.local written by setup-local, so the build talks to the local backend.
        run: |
          pnpm --filter @folevi/web build
          (cd apps/web && npx next start --port 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on@9.5.1 http://localhost:3000 --timeout 120000
      - name: Playwright (production-only checks + offline flows)
        run: pnpm --filter @folevi/web exec playwright test production.spec.ts offline.spec.ts
        env:
          E2E_NO_SERVER: "1"
          E2E_PRODUCTION: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-production
          path: |
            apps/web/playwright-report
            apps/web/test-results
            convex.log
            web.log

  record-deployment:
    name: Record deployment in the admin console
    # Runs for pushes to main after checks pass. Skipped (successfully) when no deploy key is configured.
    # Set the CONVEX_DEPLOY_KEY repository secret (Convex dashboard → Settings → Deploy keys) for the
    # deployment this branch ships to; see docs/DEPLOYMENT.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    timeout-minutes: 10
    # The production deploy key is given only to the two steps below that need it, never to the whole job: the
    # checkout, setup and install steps (third-party actions, package install scripts) can't read it
    # (docs/SECURITY_PLAN.md P0.3).
    env:
      FOLEVI_DEPLOY_ENVIRONMENT: ${{ vars.FOLEVI_DEPLOY_ENVIRONMENT || 'production' }}
    steps:
      - name: Check for a deploy key
        id: key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "No CONVEX_DEPLOY_KEY secret; skipping deployment record."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.present == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.key.outputs.present == 'true'
      - name: Record deployment
        if: steps.key.outputs.present == 'true'
        # The commit message is passed through the environment and JSON-encoded by Node, never
        # interpolated into the shell command.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ARGS=$(node -e 'const m=(process.env.COMMIT_MESSAGE||"").split("\n")[0].slice(0,200); process.stdout.write(JSON.stringify({environment:process.env.FOLEVI_DEPLOY_ENVIRONMENT,commitSha:process.env.GITHUB_SHA,commitMessage:m,source:"github-actions"}))')
          npx convex run admin:recordDeployment "$ARGS"

  clipper:
    name: Folevi Web Clipper (Chrome and Edge extension) typecheck, tests & package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/clipper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/clipper/pnpm-lock.yaml
      # apps/clipper is outside the pnpm workspace (its own lockfile).
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package

  security:
    name: Secret scan & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The whole history, every push (the gitleaks action scans only the pushed range, which fails on a
      # repository's first push).
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
