# Folevi for Windows and Linux (apps/desktop, Tauri 2): test builds on native machines, never published.
#   Windows x64 (NSIS + MSI), Windows on ARM64 (NSIS), Linux x86_64 and aarch64 (AppImage, .deb, .rpm), a Flatpak
#   bundle, the Rust tests on Windows and Linux, and memory measured against the Electron build it replaces (PR 58).
# Builds are kept as workflow artifacts for 7 days for the owner's testing (the owner's choice, 2026-11-24); nothing
# is signed, uploaded to folevi.com or released from here.
name: Desktop app

on:
  workflow_dispatch:
  # Pushes to the desktop app's own branches (a new workflow can't be started by hand until it's on main).
  push:
    branches: ["claude/desktop-*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/ios/ios/App/Native/Shell/shell-bridge.js"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Electron build this one replaces, for the memory comparison.
  ELECTRON_REF: claude/perf-electron

jobs:
  shell:
    name: Interface export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the interface built into the app (production backend)
        run: |
          # A desktop release cut before version.json catches up (apps/desktop/RELEASE_VERSION) stamps its own version.
          v=$( [ -f apps/desktop/RELEASE_VERSION ] && tr -d '[:space:]' < apps/desktop/RELEASE_VERSION || true )
          node apps/web/scripts/build-shell.mjs --platform windows --production --required --no-copy ${v:+--app-version "$v"}
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/web/.next-shell-windows-release
          retention-days: 1
          include-hidden-files: true

  build:
    name: ${{ matrix.name }}
    needs: shell
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
          - name: Windows ARM64
            os: windows-11-arm
            bundles: nsis
          - name: Linux x86_64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Linux aarch64
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: apps/desktop/web
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf libssl-dev rpm xvfb dbus-x11 libfuse2 desktop-file-utils appstream
      - name: Install
        working-directory: apps/desktop
        run: CI=true pnpm install --ignore-workspace
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --release
      - name: Bridge tests
        working-directory: apps/desktop
        run: pnpm exec vitest run
      - name: Build
        working-directory: apps/desktop
        run: node scripts/version.mjs && pnpm exec tauri build --bundles ${{ matrix.bundles }}
      - name: Linux package checks
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          dpkg-deb --info deb/*.deb | sed -n '1,30p'
          dpkg-deb --contents deb/*.deb | awk '{ print $6 }' | grep -E 'applications|metainfo|hicolor' || true
          rpm -qp --requires rpm/*.rpm
          appstreamcli validate --no-net "$GITHUB_WORKSPACE/packaging/linux/com.folevi.Folevi.metainfo.xml" || true
      - name: Sizes
        working-directory: apps/desktop/src-tauri/target/release
        run: |
          {
            echo "### ${{ matrix.name }}: installers"
            echo '| File | MB |'
            echo '| --- | ---: |'
            find bundle -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 | while IFS= read -r -d '' f; do
              echo "| $(basename "$f") | $(awk -v b=$(wc -c < "$f") 'BEGIN { printf "%.1f", b/1048576 }') |"
            done
            bin=""; for f in Folevi.exe Folevi folevi; do if [ -f "$f" ]; then bin=$f; break; fi; done
            echo "| $bin (the app itself) | $(awk -v b=$(wc -c < "$bin") 'BEGIN { printf "%.1f", b/1048576 }') |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Memory (Tauri)
        working-directory: apps/desktop
        run: |
          bin=""; for f in Folevi.exe Folevi folevi; do if [ -f "src-tauri/target/release/$f" ]; then bin=src-tauri/target/release/$f; break; fi; done
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- node scripts/measure.mjs --label tauri --out measure-tauri.json --wait 30 --expect-ready -- "$bin"
          else
            node scripts/measure.mjs --label tauri --out measure-tauri.json --wait 30 --expect-ready -- "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Folevi ${{ matrix.name }}
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/measure-tauri.json

      # The same measurement for the Electron build this replaces (PR 58), from source, on the same machine.
      - name: Electron build to compare
        if: runner.os == 'Windows' && matrix.os == 'windows-latest' || runner.os == 'Linux' && matrix.os == 'ubuntu-22.04'
        run: |
          git fetch --depth 1 origin "$ELECTRON_REF"
          git worktree add ../electron FETCH_HEAD
          cp -r apps/desktop/web ../electron/apps/desktop/web
          cd ../electron/apps/desktop
          CI=true pnpm install --ignore-workspace
          node node_modules/electron/install.js
          npx tsc -p tsconfig.json
      - name: Memory (Electron)
        if: runner.os == 'Windows' && matrix.os == 'windows-latest' || runner.os == 'Linux' && matrix.os == 'ubuntu-22.04'
        run: |
          cd ../electron/apps/desktop
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- node "$GITHUB_WORKSPACE/apps/desktop/scripts/measure.mjs" --label electron --out "$GITHUB_WORKSPACE/apps/desktop/measure-electron.json" --wait 30 -- node_modules/electron/dist/electron --no-sandbox .
          else
            node "$GITHUB_WORKSPACE/apps/desktop/scripts/measure.mjs" --label electron --out "$GITHUB_WORKSPACE/apps/desktop/measure-electron.json" --wait 30 -- node_modules/electron/dist/electron.exe .
          fi
          du -sh node_modules/electron/dist || true
      - name: Memory summary
        if: always()
        working-directory: apps/desktop
        run: |
          node -e '
            const fs = require("fs");
            const rows = ["measure-tauri.json", "measure-electron.json"].filter((f) => fs.existsSync(f)).map((f) => JSON.parse(fs.readFileSync(f, "utf8")));
            const lines = ["### ${{ matrix.name }}: memory after 30 s (first-launch screen)", "| Build | Processes | Main figure (MB) | Second figure (MB) |", "| --- | ---: | ---: | ---: |"];
            for (const r of rows) lines.push(`| ${r.label} | ${r.processes} | ${r.workingSetMB ?? r.pssMB} ${r.workingSetMB !== undefined ? "working set" : "PSS"} | ${r.privateMB ?? r.rssMB} ${r.privateMB !== undefined ? "private" : "RSS"} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            fs.writeFileSync("measure-summary.json", JSON.stringify(rows, null, 2));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Measurements ${{ matrix.name }}
          retention-days: 7
          path: apps/desktop/measure-*.json
          if-no-files-found: ignore

  # The Flatpak from each architecture's .deb, with the Flathub manifest (packaging/linux/flatpak, docs/LINUX.md).
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Folevi Linux ${{ matrix.arch }}
          path: artifacts
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build the bundle from the .deb
        run: |
          deb=$(find artifacts -name '*.deb' | head -1)
          packaging/linux/scripts/flatpak-bundle.sh "$deb" "Folevi-${{ matrix.arch }}.flatpak"
          echo "### Flatpak ${{ matrix.arch }}: $(du -m Folevi-${{ matrix.arch }}.flatpak | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Folevi Linux Flatpak ${{ matrix.arch }}
          retention-days: 7
          path: Folevi-${{ matrix.arch }}.flatpak
