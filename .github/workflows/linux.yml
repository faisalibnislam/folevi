name: Folevi for Linux

# Builds Folevi for Linux (docs/LINUX.md): AppImage, .deb and .rpm for x86_64 and aarch64 on Ubuntu 22.04 (the
# oldest glibc we support), then the Flatpak bundles. Started by hand only, and it only keeps the files as the
# run's artifacts: nothing is uploaded to folevi.com, Flathub, the Snap Store or a repository from here.

on:
  workflow_dispatch:
    inputs:
      sign_updates:
        description: "Sign the AppImage for the updater (needs the TAURI_SIGNING_PRIVATE_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the interface the desktop app carries
        run: node apps/web/scripts/build-shell.mjs --platform windows --production
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: apps/desktop/web
          retention-days: 3

  build:
    name: Linux ${{ matrix.arch }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: apps/desktop/web
      - name: Build tools
        run: sudo -E bash packaging/linux/build/install-build-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build AppImage, .deb, .rpm
        working-directory: apps/desktop/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign_updates && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri build --bundles appimage,deb,rpm
          else
            cargo tauri build --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Check the packages
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          dpkg-deb --info deb/*.deb
          rpm -qip rpm/*.rpm
          appstreamcli validate --no-net --explain "$GITHUB_WORKSPACE/packaging/linux/com.folevi.Folevi.metainfo.xml" || true
      - uses: actions/upload-artifact@v4
        with:
          name: folevi-linux-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage*
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14
