# Folevi Server packages: builds the bundle for x86_64 and aarch64, every package format from it, the apt and rpm
# repositories, the container image (as an OCI archive) and runs the old-glibc test for QNAP.
# Manual only. It never publishes, pushes an image, deploys or uploads to any store: everything ends as workflow
# artifacts for the owner to check. The only secret is the optional repository signing key.
#
# Supply chain: actions are pinned to a commit (the version is in the comment) where a commit was on record in
# this repository. Still on a tag, to be pinned by the owner: actions/setup-go, actions/download-artifact,
# docker/setup-qemu-action, docker/setup-buildx-action. QNAP's QDK is cloned at its newest commit and installed
# with sudo, so it runs only in the "qnap" job, which never sees the signing key.
name: Server packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Folevi version, for example 1.5.73 (empty: version.json)"
        required: false
        type: string
      sign:
        description: "Sign the apt/rpm repositories and rpm packages with the FOLEVI_PACKAGE_SIGNING_KEY secret"
        required: false
        type: boolean
        default: false
      fake_bundle:
        description: "Use a fake bundle (packaging test only, no real server)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: server-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: v2.43.0
  # Pinned inputs of the real bundle. Update the version and both SHA-256s together.
  # Convex backend: https://github.com/get-convex/convex-backend/releases (precompiled-* tags).
  CONVEX_BACKEND_RELEASE: precompiled-2026-11-24-f1ff8e5
  CONVEX_BACKEND_SHA256_X86_64: 1b016a4f3b92dbf33650705b6ab6700c50a9efe761ed2c093e80ca195460158b
  CONVEX_BACKEND_SHA256_AARCH64: edb8b1d50e6d2cebc5c3d119a40cf41eaae1883106ca3a4c386120c3b4ef0d5f
  # Node.js: https://nodejs.org/dist/v<version>/SHASUMS256.txt
  NODE_VERSION: 24.22.3
  NODE_SHA256_X64: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
  NODE_SHA256_ARM64: 6e51a2ada00f0011cc266f65d98922b403d7ad88f809ca2aa615a5fe1ce6e86c

jobs:
  bundle:
    name: Bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Version
        # The typed version reaches the shell through the environment, never pasted into the script, and must
        # look like a version: later steps pass it on to the build scripts.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v="$(jq -r .version version.json)"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.]+)?$'; then
            echo "::error::The version must look like 1.5.73"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The real bundle: each arch builds on its own runner, so pnpm installs the right esbuild and Next.js
      # native packages.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ !inputs.fake_bundle }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !inputs.fake_bundle }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        if: ${{ !inputs.fake_bundle }}
        with:
          go-version: "1.24"
          cache: false
      - name: Install dependencies
        if: ${{ !inputs.fake_bundle }}
        run: pnpm install --frozen-lockfile
      - name: Check convex/_generated
        if: ${{ !inputs.fake_bundle }}
        # convex/_generated is committed (CI checks it with the cloud deploy); the server deploys with
        # --codegen=disable, so it must be there.
        run: test -f convex/_generated/api.js && test -f convex/_generated/server.js && test -f convex/betterAuth/_generated/api.ts
      - name: Build the web app (server edition, standalone)
        if: ${{ !inputs.fake_bundle }}
        # No addresses at build time: the server edition reads them at runtime (CONTRACT §4).
        env:
          FOLEVI_EDITION: server
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm --filter @folevi/web build
          test -d apps/web/.next/standalone
      - name: Prepare the functions folder
        if: ${{ !inputs.fake_bundle }}
        run: server/bundle/prepare-functions.sh --arch "${{ matrix.arch }}" --out "$RUNNER_TEMP/functions"
      - name: Download the Convex backend and Node.js
        if: ${{ !inputs.fake_bundle }}
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            be_sha="$CONVEX_BACKEND_SHA256_X86_64"; node_arch=x64; node_sha="$NODE_SHA256_X64"
          else
            be_sha="$CONVEX_BACKEND_SHA256_AARCH64"; node_arch=arm64; node_sha="$NODE_SHA256_ARM64"
          fi
          be="$RUNNER_TEMP/dl/convex-local-backend-${{ matrix.arch }}-unknown-linux-gnu.zip"
          curl -fsSL --retry 3 -o "$be" \
            "https://github.com/get-convex/convex-backend/releases/download/$CONVEX_BACKEND_RELEASE/convex-local-backend-${{ matrix.arch }}-unknown-linux-gnu.zip"
          echo "$be_sha  $be" | sha256sum -c -
          node_tar="$RUNNER_TEMP/dl/node-v$NODE_VERSION-linux-$node_arch.tar.xz"
          curl -fsSL --retry 3 -o "$node_tar" "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$node_arch.tar.xz"
          echo "$node_sha  $node_tar" | sha256sum -c -
          echo "CONVEX_BACKEND=$be" >> "$GITHUB_ENV"
          echo "NODE_DIST=$node_tar" >> "$GITHUB_ENV"
      - name: Build the bundle
        if: ${{ !inputs.fake_bundle }}
        env:
          WEB_STANDALONE: apps/web/.next/standalone
          WEB_STATIC: apps/web/.next/static
          WEB_PUBLIC: apps/web/public
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Interface agreed with the supervisor workstream (server/bundle/build-bundle.sh).
          FUNCTIONS_DIR="$RUNNER_TEMP/functions" \
            server/bundle/build-bundle.sh --version "$VERSION" --arch "${{ matrix.arch }}" --out "$RUNNER_TEMP/bundle"
          du -sh "$RUNNER_TEMP"/bundle/*/* | sort -h
      - name: Make a fake bundle
        if: ${{ inputs.fake_bundle }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/test/make-fake-bundle.sh "$RUNNER_TEMP/bundle" "$VERSION" "${{ matrix.arch }}" --native
      - name: Pack the bundle
        run: |
          cd "$RUNNER_TEMP/bundle"
          d="$(ls -d folevi-server-*-linux-${{ matrix.arch }})"
          tar -cJf "$RUNNER_TEMP/$d.tar.xz" "$d"
          echo "BUNDLE_TAR=$RUNNER_TEMP/$d.tar.xz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.arch }}
          path: ${{ env.BUNDLE_TAR }}
          retention-days: 14

  packages:
    name: Packages (${{ matrix.arch }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf jq libxml2-utils xz-utils dpkg-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: ${{ runner.temp }}/in
      - name: Unpack the bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xJf "$RUNNER_TEMP"/in/*.tar.xz -C "$RUNNER_TEMP/bundle"
          echo "BUNDLE=$(ls -d "$RUNNER_TEMP"/bundle/folevi-server-*)" >> "$GITHUB_ENV"
      - name: Signing key (optional)
        if: ${{ inputs.sign }}
        env:
          KEY: ${{ secrets.FOLEVI_PACKAGE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "FOLEVI_PACKAGE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.asc"
          echo "FOLEVI_RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
      - name: Build every package (QNAP is built in its own job, away from the signing key)
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          packaging/build-all.sh --bundle "$BUNDLE" --version "$VERSION" \
            --arch "${{ matrix.arch }}" --out "$RUNNER_TEMP/out" --keep-going \
            --only synology,asustor,terramaster,ugreen,unraid,linux,docker
          rm -f "$RUNNER_TEMP/signing.asc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/out/*/*.spk
            ${{ runner.temp }}/out/*/*.apk
            ${{ runner.temp }}/out/*/*.tpk
            ${{ runner.temp }}/out/*/*.upk
            ${{ runner.temp }}/out/*/*.deb
            ${{ runner.temp }}/out/*/*.rpm
            ${{ runner.temp }}/out/unraid/*
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-context-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/docker/docker-context
          retention-days: 3

  # The QNAP package, in a job of its own: QNAP's QDK is third-party code cloned at its newest commit and
  # installed with sudo, and its qbuild makes the .qpkg. This job is given no secret, so nothing here can read
  # the package signing key. Its artifact name starts with "packages-", so the later jobs pick it up.
  qnap:
    name: QNAP package (${{ matrix.arch }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf jq xz-utils dpkg-dev
      - name: QNAP QDK (optional; falls back to the scripted .qpkg)
        continue-on-error: true
        run: |
          # QNAP's QDK builds the release .qpkg with QNAP's checksum. Unverified on GitHub runners.
          git clone --depth 1 https://github.com/qnap-dev/QDK "$RUNNER_TEMP/QDK"
          cd "$RUNNER_TEMP/QDK" && sudo ./InstallToUbuntu.sh install
          command -v qbuild
      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.arch }}
          path: ${{ runner.temp }}/in
      - name: Unpack the bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xJf "$RUNNER_TEMP"/in/*.tar.xz -C "$RUNNER_TEMP/bundle"
          echo "BUNDLE=$(ls -d "$RUNNER_TEMP"/bundle/folevi-server-*)" >> "$GITHUB_ENV"
      - name: Build the QNAP package
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          packaging/build-all.sh --bundle "$BUNDLE" --version "$VERSION" \
            --arch "${{ matrix.arch }}" --out "$RUNNER_TEMP/out" --only qnap
      - name: Old-glibc test (QNAP private glibc)
        run: |
          packaging/test/test-private-glibc.sh --bundle "$BUNDLE" --arch "${{ matrix.arch }}" \
            --images "ubuntu:16.04 centos:7" --require-docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-qnap-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/qnap/*.qpkg
          retention-days: 14

  repositories:
    name: apt, rpm and Synology sources
    needs: [bundle, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev createrepo-c jq
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/pk
          merge-multiple: true
      - name: Build the repositories
        env:
          FOLEVI_REPO_GPG_PRIVATE_KEY: ${{ inputs.sign && secrets.FOLEVI_PACKAGE_SIGNING_KEY || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/debs" "$RUNNER_TEMP/rpms" "$RUNNER_TEMP/spks"
          find "$RUNNER_TEMP/pk" -name '*.deb' -exec cp {} "$RUNNER_TEMP/debs/" \;
          find "$RUNNER_TEMP/pk" -name '*.rpm' -exec cp {} "$RUNNER_TEMP/rpms/" \;
          find "$RUNNER_TEMP/pk" -name '*.spk' -exec cp {} "$RUNNER_TEMP/spks/" \;
          packaging/linux/repo/build-server-apt-repo.sh --debs "$RUNNER_TEMP/debs" --out "$RUNNER_TEMP/repos/apt"
          packaging/linux/repo/build-server-rpm-repo.sh --rpms "$RUNNER_TEMP/rpms" --out "$RUNNER_TEMP/repos/rpm/stable"
          python3 packaging/synology/package-source/generate-index.py --spks "$RUNNER_TEMP/spks" \
            --base-url https://pkg.folevi.com/synology --out "$RUNNER_TEMP/repos/synology"
          cp packaging/linux/install.sh "$RUNNER_TEMP/repos/install.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repositories
          path: ${{ runner.temp }}/repos
          retention-days: 14

  manifest:
    name: Download manifest (latest.json)
    needs: [bundle, packages, qnap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/pk
          merge-multiple: true
      - name: Write latest.json
        # The owner uploads the package files to R2 (folevi-updates: server/<version>/) and this file to
        # server/latest.json by hand; nothing is uploaded here.
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          packaging/manifest/make-latest.sh --version "$VERSION" \
            --out "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/pk"
          cat "$RUNNER_TEMP/latest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-json
          path: ${{ runner.temp }}/latest.json
          retention-days: 14

  image:
    name: Container image (not pushed)
    needs: [bundle, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the multi-arch image as an OCI archive
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          for f in "$RUNNER_TEMP"/in/*.tar.xz; do tar -xJf "$f" -C "$RUNNER_TEMP/b"; done
          packaging/docker/build.sh --bundle "$(ls -d "$RUNNER_TEMP"/b/*-linux-x86_64)" \
            --bundle-arm64 "$(ls -d "$RUNNER_TEMP"/b/*-linux-aarch64)" \
            --version "$VERSION" --arch x86_64 --out "$RUNNER_TEMP/img" --build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-image
          path: ${{ runner.temp }}/img/*.oci.tar
          retention-days: 7
