# Folevi for Android: every dependency and plugin version in one place (Gradle version catalog).
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-coordinatorlayout = "1.3.0"
androidx-webkit = "1.14.0"
androidx-browser = "1.10.0"
androidx-biometric = "1.1.0"
androidx-splashscreen = "1.2.0"
androidx-window = "1.5.1"
androidx-work = "2.12.0"
glance = "1.2.0"
compose-bom = "2026.09.00"
tink = "1.24.0"
okhttp = "5.5.1"
mlkit-docscanner = "16.0.0"
mlkit-text = "16.0.1"
mlkit-genai-prompt = "1.0.0-beta4"
firebase-bom = "35.1.0"
play-services-auth = "21.6.0"
google-services = "4.5.0"
junit = "4.13.2"
orgjson = "20260814"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
uiautomator = "2.4.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "androidx-coordinatorlayout" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
mlkit-docscanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkit-docscanner" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkit-genai-prompt" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
