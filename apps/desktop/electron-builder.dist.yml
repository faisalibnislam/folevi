# Folevi for Mac, for everyone: a universal build (Apple silicon and Intel) signed with a Developer ID
# Application certificate, notarized by Apple, as a DMG to install and a ZIP for updates. Built and uploaded
# by `pnpm publish-mac` (scripts/publish.mjs), which checks the certificate and Apple's credentials first.
#   Signing: a "Developer ID Application" identity in the keychain (or CSC_LINK + CSC_KEY_PASSWORD).
#   Notarizing: APPLE_API_KEY (path to the .p8), APPLE_API_KEY_ID and APPLE_API_ISSUER, or APPLE_ID,
#   APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
appId: com.folevi.mac
productName: Folevi
copyright: Copyright © 2026 Folevi
directories:
  output: release-dist
  buildResources: build
files:
  - dist/**
  - "!dist/**/*.test.js"
  - assets/**
  - package.json
  - "!**/node_modules/**"
npmRebuild: false
# folevi-text, the Vision helper that reads the words in images for search (native/, scripts/build-helper.mjs).
extraResources:
  - from: native-build/folevi-text
    to: folevi-text
  # folevi-files: coordinated I/O for a library in iCloud Drive or a File Provider folder (src/library/helper.ts),
  # the bare binary the app falls back on if the helper app below can't run.
  - from: native-build/folevi-files
    to: folevi-files
  # folevi-ai: Foli AI with Apple's on-device model (FoundationModels) in local mode (src/ai.ts).
  - from: native-build/folevi-ai
    to: folevi-ai
  # The interface built into the app (apps/web `build:shell`, copied to web/ by `pnpm shell`): app://folevi
  # serves it from Contents/Resources/web when the bundled interface is switched on (src/protocol.ts).
  - from: web
    to: web
    filter:
      - "**/*"
# FoleviFiles.app, folevi-files as a helper app signed with Folevi's iCloud container (scripts/build-helper.mjs):
# in Contents/Helpers, already signed there, so the signing below leaves it alone (signIgnore).
extraFiles:
  - from: native-build/FoleviFiles.app
    to: Helpers/FoleviFiles.app
electronLanguages:
  - en
protocols:
  - name: Folevi
    schemes:
      - folevi
artifactName: Folevi-${version}-${arch}-mac.${ext}
mac:
  target:
    - target: dmg
      arch: universal
    # Squirrel.Mac (src/updates.ts) installs updates from the ZIP.
    - target: zip
      arch: universal
  category: public.app-category.productivity
  icon: build/Folevi.icon
  # electron-builder adds the "Developer ID Application:" prefix itself (it refuses a name that has it).
  identity: "Abu Mohammad Faisal (7K32QQ2FX8)"
  type: distribution
  hardenedRuntime: true
  # folevi-text, folevi-files (and FoleviFiles.app's) and folevi-ai are built universal already: they go into the
  # universal app as they are.
  x64ArchFiles: "Contents/{Resources/folevi-{text,files,ai},Helpers/FoleviFiles.app/Contents/MacOS/folevi-files}"
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # FoleviFiles.app keeps its own signature, entitlements and profile (re-signing would drop the container).
  signIgnore:
    - "/Contents/Helpers/FoleviFiles\\.app(/|$)"
  minimumSystemVersion: "13.0"
  extendInfo:
    NSMicrophoneUsageDescription: Folevi uses the microphone when you record audio into a note.
    # Recording a call: macOS 14.2 and later ask for System Audio Recording with this text when the sound
    # comes through a Core Audio tap (the screen capture itself needs no key, just the permission).
    NSAudioCaptureUsageDescription: Folevi records this Mac's sound when you record a call into a note.
    LSApplicationCategoryType: public.app-category.productivity
    NSUserNotificationAlertStyle: alert
dmg:
  title: Folevi
  artifactName: Folevi-${version}-mac.${ext}
