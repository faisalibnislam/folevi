# Folevi for Windows: one native build per architecture, Windows on ARM (arm64) and Intel/AMD (x64), never an x64
# build run under emulation. scripts/dist.mjs builds both, each as:
#   Folevi-Setup-<version>-<arch>.exe   the installer (NSIS, per user, no admin rights), which updates itself
#   Folevi-<version>-<arch>.zip         a portable copy for testing (no installer, no updates)
# Installers are unsigned until the owner sets up signing (2026-11-24: "Unsigned for now"), so SmartScreen warns.
# Updates: electron-updater reads https://folevi.com/download/windows/<arch>/latest.yml (the R2 bucket
# folevi-updates, as the Mac's). Nothing is uploaded from here; publishing is a separate step the owner approves.
appId: com.folevi.windows
productName: Folevi
executableName: Folevi
copyright: Copyright © 2026 Folevi
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - "!dist/**/*.test.js"
  - assets/**
  - package.json
# The interface built into the app (apps/web build-shell.mjs --platform windows): served as app://folevi.
extraResources:
  - from: web
    to: web
    filter:
      - "**/*"
# No native modules, so nothing to rebuild per architecture (electron-updater is plain JavaScript).
npmRebuild: false
nodeGypRebuild: false
# folevi:// links (src/urls.ts parseDeepLink, sign-in's folevi://auth/callback). The installer registers it.
protocols:
  - name: Folevi
    schemes:
      - folevi
# English only (Chromium ships dozens of interface languages; the app's own text is English).
electronLanguages:
  - en-US
win:
  icon: build/icon.ico
  # The portable ZIP's name (the installer's is under nsis).
  artifactName: Folevi-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Unsigned for now: no certificate, no Azure signing (the owner's choice, 2026-11-24).
  signAndEditExecutable: true
  forceCodeSigning: false
  verifyUpdateCodeSignature: false
  requestedExecutionLevel: asInvoker
  legalTrademarks: Folevi
# One click: installs for the person signed in to Windows (no admin rights) into their AppData, then opens Folevi.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Folevi
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Folevi
  artifactName: Folevi-Setup-${version}-${arch}.${ext}
publish:
  - provider: generic
    url: https://folevi.com/download/windows/${arch}
    channel: latest
# NSIS 3.12 (electron-builder's unified bundle): it runs natively on Apple silicon Macs, so the installers cross-build
# here; the old 3.0.4 bundle's makensis is an Intel binary that failed under Rosetta.
toolsets:
  nsis: "1.2.1"
