# Folevi for Linux as a Flatpak, built in CI from the .deb that `tauri build` makes (.github/workflows/desktop.yml
# copies it here as folevi.deb). For testing only; com.folevi.desktop.yml is the one for Flathub.
app-id: com.folevi.desktop
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: folevi
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Notifications, the tray icon (where the desktop has one) and the credential store for the data key.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  # The library "On this computer" lives in Documents; "Choose a folder" may pick one anywhere in home.
  - --filesystem=home
modules:
  - name: folevi
    buildsystem: simple
    sources:
      - type: file
        path: folevi.deb
      - type: file
        path: com.folevi.desktop.desktop
      - type: file
        path: com.folevi.desktop.metainfo.xml
    build-commands:
      - ar -x folevi.deb
      - tar -xf data.tar.*
      - install -Dm755 "$(find usr/bin -maxdepth 1 -type f | head -1)" /app/bin/folevi
      - install -Dm644 com.folevi.desktop.desktop /app/share/applications/com.folevi.desktop.desktop
      - install -Dm644 com.folevi.desktop.metainfo.xml /app/share/metainfo/com.folevi.desktop.metainfo.xml
      - |
        for f in usr/share/icons/hicolor/*/apps/*.png; do
          size=$(basename "$(dirname "$(dirname "$f")")")
          install -Dm644 "$f" "/app/share/icons/hicolor/$size/apps/com.folevi.desktop.png"
        done
