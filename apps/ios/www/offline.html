<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Folevi</title>
<style>
  /* Shown when neither the network nor the site's cache has Folevi (the first launch needs the network).
     The app's neutral chrome colours (packages/design-tokens, tokens.chrome) and its control corner (10px). */
  :root { color-scheme: light dark; --bg: #fff; --ink: #18181b; --muted: #56565e; --btn: #1f1f22; --btn-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101011; --ink: #f2f2f3; --muted: #a6a6ae; --btn: #f2f2f3; --btn-ink: #101011; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  main { max-width: 340px; padding: 24px; text-align: center; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--btn); color: var(--btn-ink); }
  button:disabled { opacity: 0.6; }
</style>
</head>
<body>
<main>
  <h1>Folevi can't connect</h1>
  <p>Check your internet connection. Folevi needs it the first time it opens; after that your notes open offline too.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  const button = document.getElementById("retry");
  const retry = () => {
    button.disabled = true;
    const native = window.Capacitor && window.Capacitor.nativePromise;
    if (native) native("FoleviNative", "retry", {}).catch(() => undefined);
    setTimeout(() => { button.disabled = false; }, 1500);
  };
  button.addEventListener("click", retry);
  addEventListener("online", retry);
</script>
</body>
</html>
