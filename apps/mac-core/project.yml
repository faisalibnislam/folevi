# Folevi Core: a new, fully native macOS 26 app (SwiftUI with AppKit where it matters), beside today's Folevi for
# Mac. Its own name, bundle id, icon, data folder, Keychain names and URL scheme, signing in to the same accounts.
# XcodeGen spec: scripts/project.mjs turns it into FoleviCore.xcodeproj (not committed).
#
# What it reuses, by path and never copied (README.md, "What Core shares"):
#   - the shared sync engine and editor: the bundled web export (apps/web, build-shell.mjs) in native chrome mode,
#     driven through FoleviEngine (apps/native-kit), the typed bridge generated from protocol.ts;
#   - the data layer's native side: the shell services shared with the iPhone and iPad app (library, sign-in,
#     keys, Foli AI on device, places) and the Mac host's UI-free plumbing (the app:// scheme, the message
#     routers, places, background sync);
#   - FoleviDesign for the fonts (Spectral, Instrument Sans), tokens and the folder and note glyphs.
# Everything the person sees is Core's own (FoleviCore/).
name: FoleviCore
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  FoleviKit:
    path: ../native-kit
settings:
  base:
    # Folevi's one version (version.json); release.mjs passes version.json's at build time.
    MARKETING_VERSION: "1.5.63"
    CURRENT_PROJECT_VERSION: 78
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 7K32QQ2FX8
    CODE_SIGN_STYLE: Automatic
    # The shared host files are written for the Swift 5 language mode (as today's Mac app builds them).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FoleviCore:
    type: application
    platform: macOS
    sources:
      - path: FoleviCore
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
      # The app icon: Folevi's own (the owner, 21 November 2026: keep the main app's coloured icon), the same Icon
      # Composer file the iPhone, iPad and today's Mac app use.
      - path: ../ios/ios/App/App/AppIcon.icon
        group: Shared
      # The Mac host's UI-free plumbing (apps/mac/Folevi), by path: the app:// scheme that serves the export and
      # carries big bridge bodies, the "folevi" message handler and the foleviShell router, places and their
      # hidden runners, background sync, links, the offline switch and a few system services.
      - path: ../mac/Folevi/App/AppScheme.swift
        group: Shared/Host
      - path: ../mac/Folevi/App/BackgroundSync.swift
        group: Shared/Host
      - path: ../mac/Folevi/App/Links.swift
        group: Shared/Host
      - path: ../mac/Folevi/App/Offline.swift
        group: Shared/Host
      - path: ../mac/Folevi/App/Places.swift
        group: Shared/Host
      - path: ../mac/Folevi/Bridge/MessageRouter.swift
        group: Shared/Host
      - path: ../mac/Folevi/Bridge/ShellRouter.swift
        group: Shared/Host
      - path: ../mac/Folevi/Bridge/FakeAI.swift
        group: Shared/Host
      - path: ../mac/Folevi/Bridge/DesktopRouter+SignIn.swift
        group: Shared/Host
      - path: ../mac/Folevi/Bridge/mac-bridge.js
        group: Shared/Host
        buildPhase: resources
      - path: ../mac/Folevi/Bridge/capabilities.js
        group: Shared/Host
        buildPhase: resources
      - path: ../mac/Folevi/Updates/Updater.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/Clipboard.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/Downloads.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/LoginItem.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/Printing.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/TextRecognition.swift
        group: Shared/Host
      - path: ../mac/Folevi/Services/CallRecorder.swift
        group: Shared/Host
      # The shell services shared with the iPhone and iPad app (apps/ios/ios/App/Native/Shell), the same set
      # today's Mac app builds (everything there but FoleviShellPlugin.swift, the Capacitor transport).
      - path: ../ios/ios/App/Native/Shell/E2eeKeys.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/EncryptedFS.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/Keychain.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryCrypto.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryFileHandler.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryFS.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryJournal.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryPaths.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryService.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/LibraryWatcher.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/Platform.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/ShellAI.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/ShellAuth.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/ShellCloud.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/ShellPlaces.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/ShellServices.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Native/Shell/shell-bridge.js
        group: Shared/Shell
        buildPhase: resources
      - path: ../ios/ios/App/Native/Shell/folevi-cloud.js
        group: Shared/Shell
        buildPhase: resources
      - path: ../ios/ios/App/Shared/SaveTargets.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Shared/DeviceCredential.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Shared/Folevi.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Shared/FoleviAPI.swift
        group: Shared/Shell
      - path: ../ios/ios/App/Shared/LocalExtras.swift
        group: Shared/Shell
    dependencies:
      - package: Sparkle
      - package: FoleviKit
        product: FoleviEngine
      - package: FoleviKit
        product: FoleviDesign
      - package: FoleviKit
        product: FoleviEngineDemo
    settings:
      base:
        PRODUCT_MODULE_NAME: FoleviCore
        INFOPLIST_FILE: FoleviCore/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        # Development: its own bundle id, support folder, Keychain names and URL scheme (CorePaths.swift), so it
        # never touches the installed Folevi Core, today's Folevi or their data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.folevicore.FoleviCore.dev
          PRODUCT_NAME: Folevi Core Dev
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: FoleviCore/Resources/FoleviCoreDev.entitlements
          FOLEVI_URL_SCHEME: folevi-core-dev
          FOLEVI_DEV_SHELL_DIR: "$(SRCROOT)/web"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.folevicore.FoleviCore
          PRODUCT_NAME: Folevi Core
          # Automatic signing for the archive; release.mjs signs the shipped app again with Developer ID.
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: FoleviCore/Resources/FoleviCore.entitlements
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          FOLEVI_URL_SCHEME: folevi-core
          FOLEVI_DEV_SHELL_DIR: ""
  FoleviCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FoleviCoreTests
    dependencies:
      - target: FoleviCore
      - package: FoleviKit
        product: FoleviEngineDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.folevicore.FoleviCore.dev.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Folevi Core Dev.app/Contents/MacOS/Folevi Core Dev"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
schemes:
  FoleviCore:
    build:
      targets:
        FoleviCore: all
        FoleviCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoleviCoreTests
      environmentVariables:
        FOLEVI_USER_DATA: "$(PROJECT_DIR)/build/run/tests"
    archive:
      config: Release
