# XcodeGen spec for the native Folevi macOS app.
# Regenerate the committed project with:  cd apps/macos && xcodegen generate
name: Folevi
options:
  bundleIdPrefix: com.folevi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The ConvexMobile Rust core ships an arm64-only macOS slice.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
targets:
  Folevi:
    type: application
    platform: macOS
    sources:
      - path: Folevi
        excludes:
          - "Info.plist"
          - "Folevi.entitlements"
          - "Resources/Fonts"
          - "Resources/Fonts/**"
          - "Resources/Covers"
          - "Resources/Covers/**"
      # Instrument Sans, Spectral and JetBrains Mono (+ OFL licenses), copied to Contents/Resources/Fonts
      # and registered through ATSApplicationFontsPath (and FoleviFont.registerBundledFonts()).
      - path: Folevi/Resources/Fonts
        type: folder
        buildPhase: resources
      # The 57 note styles (the web's 1600 px pages and 640 px thumbnails) + covers.json → Contents/Resources/Covers.
      - path: Folevi/Resources/Covers
        type: folder
        buildPhase: resources
    dependencies:
      - package: ConvexMobile
    settings:
      base:
        PRODUCT_NAME: Folevi
        PRODUCT_MODULE_NAME: Folevi
        INFOPLIST_FILE: Folevi/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: "-traditional"
        CODE_SIGN_ENTITLEMENTS: Folevi/Folevi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  FoleviTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FoleviTests
      - path: Folevi/Domain
      - path: Folevi/Sync/SyncReducer.swift
      - path: Folevi/Data/Local/SQLiteStore.swift
      - path: Folevi/Support/Keychain.swift
      - path: Folevi/Features/Auth/AuthCallback.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folevi.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOLEVI_TESTS"
  FoleviUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FoleviUITests
    dependencies:
      - target: Folevi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folevi.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Folevi
schemes:
  Folevi:
    build:
      targets:
        Folevi: all
        FoleviTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: FoleviTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FoleviUITests:
    build:
      targets:
        Folevi: all
        FoleviUITests: [test]
    test:
      config: Debug
      targets:
        - name: FoleviUITests
