{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.folevi_container_name, "image") %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.set_stop_grace_period(60) %}
{% do c1.set_command(["run", "--data", values.consts.data_path, "--bundle", "/opt/folevi"]) %}
{# The image has no curl or wget; check with its own Node (unverified helper name: check the library version). #}
{% do c1.healthcheck.set_custom_test(["CMD", "/opt/folevi/runtime/node/bin/node", "-e", "fetch('http://127.0.0.1:%d/.well-known/folevi.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" | format(values.network.web_port.port_number)]) %}

{% do c1.environment.add_env("FOLEVI_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("FOLEVI_PACKAGE", "truenas") %}
{% do c1.environment.add_user_envs(values.folevi.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body("Open Folevi Server's Web UI to create the owner account.") %}

{{ tpl.render() | tojson }}
