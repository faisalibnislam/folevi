# Folevi for Linux as a Flatpak, ready for Flathub (docs/LINUX.md, "Flathub"). Not submitted: that needs the
# owner's OK. Folevi's source is private, so (like other closed-source apps on Flathub) this repackages the signed
# release .deb from folevi.com instead of building from source.
#
# Runtime: GNOME 51 is the last GNOME runtime that still ships WebKitGTK 4.1 (the GTK 3 WebKit Tauri 2 uses).
# It's supported until about September 2027; before then Tauri needs its GTK 4 port, or we move to another
# runtime that carries WebKitGTK 4.1 (docs/LINUX.md, "WebKitGTK").
#
# Local or CI test build (no download): packaging/linux/scripts/flatpak-bundle.sh points the .deb sources at a local file.
id: com.folevi.Folevi
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: folevi
separate-locales: false

finish-args:
  # Display: Wayland first, X11 only where there's no Wayland. GPU for WebKit's compositing.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sync with your Folevi account, Foli AI, images.
  - --share=network
  # Sound for audio notes and media in notes.
  - --socket=pulseaudio
  # Desktop notifications (reminders, comments). The app talks to org.freedesktop.Notifications directly.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (StatusNotifierItem, what libayatana-appindicator speaks).
  - --talk-name=org.kde.StatusNotifierWatcher
  # The sign-in is kept in the desktop's keyring (GNOME Keyring, KWallet) through the Secret Service.
  - --talk-name=org.freedesktop.secrets
  # Notes "on this computer" are plain files in a folder (Documents/Folevi Library by default, or one the person
  # chooses anywhere in their home), which Folevi watches for changes made by other apps and sync tools. The
  # document portal can't deliver those change events, so, like other notes apps on Flathub that keep notes as
  # files, Folevi gets the home folder. Import and export go through the file chooser portal.
  - --filesystem=home

modules:
  # The tray icon: the GNOME runtime has no libayatana-appindicator. These modules are Flathub's shared module
  # (flathub/shared-modules libayatana-appindicator-gtk3.json and intltool-0.51.json at 34add58f, 2026-11-22, with
  # their patches in patches/), copied here with one change: the CMake modules install into /app/lib. With the
  # GNOME 51 SDK's CMake they otherwise go to /app/lib64, where neither the next module's pkg-config nor the app's
  # loader looks ("libayatana-ido3-0.4 not found").
  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    cleanup: [/include, /lib/pkgconfig]
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    modules:
      - name: intltool
        cleanup: ['*']
        sources:
          - type: archive
            url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
            mirror-urls:
              - https://gstreamer.freedesktop.org/src/mirror/intltool-0.51.0.tar.gz
            sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
          - type: patch
            path: patches/intltool-perl5.26-regex-fixes.patch
      - name: libdbusmenu
        buildsystem: autotools
        build-options:
          cflags: -Wno-error
        cleanup: ['*.la', /include, /lib/pkgconfig, /libexec, /share/doc, /share/gtk-doc]
        config-opts:
          - --with-gtk=3
          - --disable-dumper
          - --disable-static
          - --disable-tests
          - --disable-gtk-doc
          - --enable-introspection=no
          - --disable-vala
        sources:
          - type: archive
            url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
            mirror-urls:
              - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
            sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
          - type: patch
            paths: [patches/0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch]
      - name: ayatana-ido
        buildsystem: cmake-ninja
        cleanup: [/include, /lib/pkgconfig]
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DENABLE_INTROSPECTION=OFF
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/ayatana-ido.git
            tag: 0.10.4
            commit: f968079b09e2310fefc3fc307359025f1c74b3eb
          - type: patch
            paths: [patches/0001-Make-introspection-configurable.patch]
      - name: libayatana-indicator
        buildsystem: cmake-ninja
        cleanup: [/include, /lib/pkgconfig, /libexec, /share]
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/libayatana-indicator.git
            tag: 0.9.5
            commit: 0db7877be8c61953b50540183d5932ab159181f1
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.6.1
        commit: 836356daa20c833cbc051c77c6b4f97c94de5e61

  - name: folevi
    buildsystem: simple
    sources:
      # The release .deb for each architecture, from folevi.com/download/linux (versioned files never change).
      # A new release: packaging/linux/scripts/flathub-submission.sh --set-version <v> fills in both.
      - type: file
        only-arches: [x86_64]
        url: https://folevi.com/download/linux/Folevi_1.5.75_amd64.deb
        sha256: d3844283c2109c775116fab626ef21d01c559add0b0d489f35b34071500ba4b3
        dest-filename: folevi.deb
      - type: file
        only-arches: [aarch64]
        url: https://folevi.com/download/linux/Folevi_1.5.75_arm64.deb
        sha256: d18bc16d163ea583cdabbf84eb3a8a14cfb035a85f789172f11b1d69c4c398bd
        dest-filename: folevi.deb
      - type: file
        path: ../com.folevi.Folevi.metainfo.xml
      - type: file
        path: ../folevi.desktop.hbs
    build-commands:
      - ar x folevi.deb
      - tar -xf data.tar.*
      # The program and the files Tauri ships beside it (usr/lib/Folevi when there are any).
      - install -Dm755 usr/bin/folevi /app/bin/folevi
      - if [ -d usr/lib/Folevi ]; then mkdir -p /app/lib && cp -a usr/lib/Folevi /app/lib/; fi
      # Desktop entry under the app id (Flatpak requires it), from the same template the .deb uses.
      - >-
        sed -e 's|{{name}}|Folevi|g' -e 's|{{exec}}|folevi|g' -e 's|{{icon}}|com.folevi.Folevi|g'
        -e 's|^StartupWMClass=.*|StartupWMClass=com.folevi.Folevi|'
        folevi.desktop.hbs > com.folevi.Folevi.desktop
      - desktop-file-validate com.folevi.Folevi.desktop
      - install -Dm644 com.folevi.Folevi.desktop /app/share/applications/com.folevi.Folevi.desktop
      # The .deb's metainfo names its desktop file Folevi.desktop; here it's the app id's.
      - sed -i 's|<launchable type="desktop-id">Folevi.desktop</launchable>|<launchable type="desktop-id">com.folevi.Folevi.desktop</launchable>|' com.folevi.Folevi.metainfo.xml
      - install -Dm644 com.folevi.Folevi.metainfo.xml /app/share/metainfo/com.folevi.Folevi.metainfo.xml
      # Icons, renamed to the app id.
      - >-
        for d in usr/share/icons/hicolor/*/apps; do
          size=$(basename "$(dirname "$d")");
          for f in "$d"/folevi.*; do
            [ -e "$f" ] || continue;
            install -Dm644 "$f" "/app/share/icons/hicolor/$size/apps/com.folevi.Folevi.${f##*.}";
          done;
        done
