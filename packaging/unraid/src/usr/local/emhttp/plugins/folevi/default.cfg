# Folevi Server plugin settings (copied to /boot/config/plugins/folevi/folevi.cfg once; edit in Settings > Folevi Server).
AUTOSTART="yes"
# Data (SQLite database and files). A pool path such as /mnt/cache/appdata/folevi is faster and safer for the
# database than the /mnt/user share layer.
DATA_DIR="/mnt/user/appdata/folevi/data"
# Where the program is unpacked from the flash cache at array start.
INSTALL_DIR="/mnt/user/appdata/folevi/server"
FOLEVI_PORT="8460"
FOLEVI_HTTPS_PORT="8443"
RUN_AS="nobody"
